<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>Kulüp Takip</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #fafafb;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e6e8ec;
    --primary: #4f46e5;
    --primary-weak: #eef2ff;
    --primary-ink: #3730a3;
    --success: #16a34a;
    --success-weak: #dcfce7;
    --warning: #b45309;
    --warning-weak: #fef3c7;
    --danger: #dc2626;
    --danger-weak: #fee2e2;
    --danger-ink: #b91c1c;
    --info: #0e7490;
    --info-weak: #cffafe;
    --gray-weak: #f1f3f5;
    --gray-ink: #5b6472;
    --success-ink: #166534;
    --track: #edeef1;
    --callout-border: #dfe3ff;
    --toggle-off: #d1d5db;
    --surface-alpha: rgba(255,255,255,.9);
    --surface-alpha-2: rgba(255,255,255,.92);
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-lg: 0 10px 25px rgba(16,24,40,.12);
    --radius: 14px;
    --radius-sm: 10px;
    --maxw: 920px;
  }
  :root[data-theme="dark"] {
    --bg: #0e1015;
    --surface: #171a21;
    --surface-2: #1e222b;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --border: #2a2f3a;
    --primary: #6d6ef8;
    --primary-weak: #22224a;
    --primary-ink: #c7d2fe;
    --success: #22c55e;
    --success-weak: #123321;
    --success-ink: #86efac;
    --warning: #f5a524;
    --warning-weak: #3a2a0d;
    --danger: #f87171;
    --danger-weak: #3a1414;
    --danger-ink: #fca5a5;
    --info: #22d3ee;
    --info-weak: #0e2e35;
    --gray-weak: #232630;
    --gray-ink: #b7bec9;
    --track: #262a34;
    --callout-border: #33345f;
    --toggle-off: #3a3f4b;
    --surface-alpha: rgba(23,26,33,.88);
    --surface-alpha-2: rgba(23,26,33,.92);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { transition: background-color .15s ease, color .15s ease; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    padding-bottom: 76px; /* space for bottom tabbar */
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--primary); }

  /* App bar */
  .appbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface-alpha);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .appbar-inner {
    max-width: var(--maxw); margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    display: grid; place-items: center; color: #fff; box-shadow: var(--shadow);
  }
  .brand .logo svg { width: 18px; height: 18px; }
  .appbar .spacer { flex: 1; }
  .user-switch {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 6px 4px 12px;
  }
  .user-switch .who { font-size: 12px; color: var(--muted); display: none; }
  .user-switch select {
    border: none; background: transparent; font: inherit; font-size: 13px; font-weight: 600;
    color: var(--text); padding: 4px 2px; max-width: 150px;
  }
  .user-switch select:focus { outline: none; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); display: grid; place-items: center; color: var(--muted);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Layout */
  main { max-width: var(--maxw); margin: 0 auto; padding: 16px; }
  .view-head { display: flex; align-items: center; gap: 12px; margin: 4px 2px 14px; }
  .view-head h2 { font-size: 22px; }
  .view-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .view-head .spacer { flex: 1; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    transition: .12s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: var(--shadow); }
  .btn.primary:hover { background: #4338ca; }
  .btn.success { background: var(--success); border-color: var(--success); color: #fff; }
  .btn.success:hover { filter: brightness(.96); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.danger-ghost { border-color: transparent; background: transparent; color: var(--danger); }
  .btn.danger-ghost:hover { background: var(--danger-weak); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 12px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; margin: 22px 2px 10px; }

  /* Stat tiles */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat .n { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stat .chip { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .stat .chip svg { width: 18px; height: 18px; }
  .chip.i-primary { background: var(--primary-weak); color: var(--primary); }
  .chip.i-success { background: var(--success-weak); color: var(--success); }
  .chip.i-warning { background: var(--warning-weak); color: var(--warning); }
  .chip.i-danger { background: var(--danger-weak); color: var(--danger); }
  .chip.i-info { background: var(--info-weak); color: var(--info); }

  /* List rows */
  .list { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 650; font-size: 15px; }
  .row .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #cbd0d8; }
  .row .actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

  .avatar {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff;
  }
  .avatar.sm { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .badge .bd { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-gray { background: var(--gray-weak); color: var(--gray-ink); }
  .b-primary { background: var(--primary-weak); color: var(--primary-ink); }
  .b-success { background: var(--success-weak); color: var(--success-ink); }
  .b-warning { background: var(--warning-weak); color: var(--warning); }
  .b-danger { background: var(--danger-weak); color: var(--danger-ink); }
  .b-info { background: var(--info-weak); color: var(--info); }

  /* Meter */
  .meter { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .meter > span { display: block; height: 100%; border-radius: 999px; background: var(--success); }

  /* Segmented / filters */
  .seg { display: inline-flex; background: var(--track); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: none; background: transparent; padding: 7px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* Empty state */
  .empty { text-align: center; padding: 34px 18px; color: var(--muted); }
  .empty svg { width: 34px; height: 34px; opacity: .5; margin-bottom: 8px; }
  .empty .t { font-weight: 650; color: var(--text); }
  .empty .s { font-size: 13px; margin-top: 3px; }

  /* Bottom tab bar */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--surface-alpha-2); backdrop-filter: saturate(180%) blur(10px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: center; gap: 2px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar .tabs { display: flex; gap: 2px; width: 100%; max-width: 560px; }
  .tab {
    flex: 1; border: none; background: transparent; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 4px; color: var(--muted); font-size: 11px; font-weight: 600;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--primary); background: var(--primary-weak); }

  /* Modal */
  .modal-root { position: fixed; inset: 0; z-index: 60; display: none; }
  .modal-root.open { display: block; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(17,24,39,.5); }
  .modal {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: var(--surface);
    border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg);
    max-height: 92vh; overflow-y: auto; padding: 18px 18px 22px;
    animation: sheet .22s ease;
  }
  @keyframes sheet { from { transform: translate(-50%, 20px); opacity: .6; } to { transform: translate(-50%, 0); opacity: 1; } }
  @media (min-width: 560px) {
    .modal { bottom: auto; top: 50%; transform: translate(-50%, -50%); border-radius: 18px; }
    @keyframes sheet { from { transform: translate(-50%, -46%); opacity: .6; } to { transform: translate(-50%, -50%); opacity: 1; } }
  }
  .modal h3 { font-size: 18px; margin-bottom: 2px; }
  .modal .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 14px; background: var(--surface); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; }
  .switch-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .switch-line .lbl { font-size: 14px; font-weight: 600; }
  .switch-line .desc { font-size: 12px; color: var(--muted); }
  .toggle { position: relative; width: 46px; height: 27px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider { position: absolute; inset: 0; background: var(--toggle-off); border-radius: 999px; transition: .16s; }
  .toggle .slider::before { content: ""; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .16s; box-shadow: var(--shadow); }
  .toggle input:checked + .slider { background: var(--primary); }
  .toggle input:checked + .slider::before { transform: translateX(19px); }

  /* Attendance segmented control per member */
  .att-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .att-row:last-child { border-bottom: none; }
  .att-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; flex-shrink: 0; }
  .att-seg button { border: none; background: var(--surface); padding: 7px 11px; font-size: 12.5px; font-weight: 650; color: var(--muted); border-right: 1px solid var(--border); }
  .att-seg button:last-child { border-right: none; }
  .att-seg button.on.present { background: var(--success); color: #fff; }
  .att-seg button.on.absent { background: var(--danger); color: #fff; }
  .att-seg button.on.excused { background: var(--warning); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    box-shadow: var(--shadow-lg); z-index: 80; opacity: 0; transition: .22s ease; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .callout {
    background: var(--primary-weak); border: 1px solid var(--callout-border); color: var(--primary-ink);
    border-radius: var(--radius); padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
  }
  .callout svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  .kv { display: flex; gap: 8px; font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--border); align-items: center; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); width: 120px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .kv .v { font-weight: 600; }
  .kv svg, .meta svg { width: 14px; height: 14px; flex-shrink: 0; vertical-align: -2px; }
  .section-title svg { width: 15px; height: 15px; flex-shrink: 0; vertical-align: -2px; }
  .avatar svg { width: 18px; height: 18px; }
  .avatar.sm svg { width: 14px; height: 14px; }
  svg { flex-shrink: 0; }

  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .clickable { cursor: pointer; }
  .clickable:hover { background: var(--surface-2); }
  @media (max-width: 620px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .row-2 { grid-template-columns: 1fr; }
    .user-switch .who { display: none; }
  }
</style>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kulüp Takip" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <span class="logo" id="brandLogo"></span>
        <span id="clubName">Kulüp Takip</span>
      </div>
      <div class="spacer"></div>
      <div class="user-switch" id="clubSwitchBox" title="Kulüp değiştir" style="display:none">
        <select id="clubSelectEl" aria-label="Kulüp seç"></select>
      </div>
      <button class="icon-btn" id="platformAdminBtn" title="Platform Yönetimi" aria-label="Platform yönetimi" style="display:none"></button>
      <button class="icon-btn" id="langBtn" title="Language / Dil" aria-label="Dil değiştir" style="font-size:12px;font-weight:700">EN</button>
      <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Tema değiştir"></button>
      <button class="icon-btn" id="settingsBtn" title="Ayarlar" aria-label="Ayarlar" style="display:none"></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <div class="tabs" id="tabs"></div>
  </nav>

  <div class="modal-root" id="modalRoot" aria-hidden="true"></div>
  <div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebaseConfig.js"></script>
<script src="app.js"></script>
</body>
</html>
